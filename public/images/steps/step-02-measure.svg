<svg width="400" height="260" viewBox="0 0 400 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Measuring Tape Running Across Card -->
  <defs>
    <pattern id="measureGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#CBD5E1" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="400" height="260" fill="url(#measureGrid)"/>

  <!-- Curved Measuring Tape Ribbon -->
  <path d="M 120 260 C 180 200, 260 180, 400 130" stroke="#FFC72C" stroke-width="26" stroke-linecap="round" stroke-opacity="0.25"/>
  <path d="M 120 260 C 180 200, 260 180, 400 130" stroke="#0B1528" stroke-width="26" stroke-dasharray="2 8" stroke-linecap="round" stroke-opacity="0.15"/>
  <path d="M 120 260 C 180 200, 260 180, 400 130" stroke="#0B1528" stroke-width="26" stroke-dasharray="1 18" stroke-linecap="round" stroke-opacity="0.3"/>

  <!-- Anatomic Silhouette Outline & Calibration lines -->
  <g transform="translate(250, 40)" opacity="0.18">
    <!-- Shoulder & Chest line -->
    <path d="M 40 40 C 60 20, 100 20, 120 40 L 140 70 L 120 180 L 40 180 L 20 70 Z" fill="none" stroke="#0B1528" stroke-width="2" stroke-dasharray="4 3"/>
    <!-- Dimension arrows -->
    <line x1="20" y1="90" x2="140" y2="90" stroke="#C28B28" stroke-width="1.5"/>
    <circle cx="20" cy="90" r="3" fill="#C28B28"/>
    <circle cx="140" cy="90" r="3" fill="#C28B28"/>
    <line x1="40" y1="140" x2="120" y2="140" stroke="#C28B28" stroke-width="1.5"/>
    <circle cx="40" cy="140" r="3" fill="#C28B28"/>
    <circle cx="120" cy="140" r="3" fill="#C28B28"/>
  </g>
</svg>


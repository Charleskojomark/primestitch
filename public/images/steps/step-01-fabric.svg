      <path d="M 0 12 L 12 0 L 24 12 L 12 24 Z" fill="none" stroke="#C28B28" stroke-width="0.75" stroke-opacity="0.35"/>
      <circle cx="12" cy="12" r="3" fill="#0B1528" fill-opacity="0.1"/>

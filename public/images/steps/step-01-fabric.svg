  </defs>
  <rect width="400" height="260" fill="url(#brocadeWeave)"/>
  <!-- Fabric Roll Drape Graphic -->
  <path d="M 220 260 C 240 180, 310 140, 400 120" stroke="#0B1528" stroke-width="2" stroke-opacity="0.15" fill="none"/>

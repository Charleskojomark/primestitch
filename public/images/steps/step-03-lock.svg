<svg width="400" height="260" viewBox="0 0 400 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="stitchGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 0 15 L 30 15" stroke="#CBD5E1" stroke-width="0.75" stroke-dasharray="3 4" stroke-opacity="0.3"/>
      <path d="M 15 0 L 15 30" stroke="#CBD5E1" stroke-width="0.75" stroke-dasharray="3 4" stroke-opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="400" height="260" fill="url(#stitchGrid)"/>

  <!-- Calendar Card & Lock Seal Watermark -->
  <g transform="translate(230, 60)" opacity="0.22">
    <!-- Calendar Grid -->
    <rect x="20" y="20" width="130" height="130" rx="8" fill="#F8FAFC" stroke="#C28B28" stroke-width="2"/>
    <rect x="20" y="20" width="130" height="32" rx="6" fill="#FFC72C"/>
    <!-- Calendar Header Dots -->
    <circle cx="36" cy="36" r="3" fill="#0B1528"/>
    <circle cx="50" cy="36" r="3" fill="#0B1528"/>
    <!-- Mini Date Cells -->
    <line x1="20" y1="80" x2="150" y2="80" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="20" y1="110" x2="150" y2="110" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="60" y1="52" x2="60" y2="150" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="105" y1="52" x2="105" y2="150" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Certified Padlock on Calendar -->
    <g transform="translate(65, 75)">
      <rect x="0" y="16" width="40" height="32" rx="4" fill="#0B1528" stroke="#FFC72C" stroke-width="1.5"/>
      <path d="M 10 16 L 10 9 C 10 3, 30 3, 30 9 L 30 16" fill="none" stroke="#FFC72C" stroke-width="3" stroke-linecap="round"/>
      <circle cx="20" cy="30" r="4" fill="#FFC72C"/>
      <line x1="20" y1="32" x2="20" y2="38" stroke="#FFC72C" stroke-width="2"/>
    </g>
  </g>
</svg>

